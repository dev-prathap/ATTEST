[project]
name = "attestlayer"
version = "0.1.0"
description = "Attest — proof layer for AI agents: decide, gate, verify, attest."
authors = [{ name = "Prathap" }]
keywords = ["ai-agents", "audit", "human-in-the-loop", "verification", "langgraph", "mcp"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Topic :: Security", "Topic :: Software Development :: Libraries"]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/dev-prathap/ATTEST"
Documentation = "https://dev-prathap.github.io/ATTEST/"
Repository = "https://github.com/dev-prathap/ATTEST"

[project.scripts]
attestlayer = "attest.mcp.launcher:main"
attest = "attest.cli:main"
attest-mcp = "attest.mcp.proxy:main"
attest-mcp-server = "attest.mcp.server:main"
attest-gateway = "attest.gateway.server:main"

[project.optional-dependencies]
langgraph = ["langgraph>=0.2", "langchain-core>=0.3"]
openai = ["openai-agents>=0.1"]
slack = ["slack_sdk>=3.20", "slack_bolt>=1.18"]
signing = ["cryptography>=42"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain>=1.0",
    "openai-agents>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["attest"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"examples/*" = ["E501"]
"attest/server.py" = ["E501"]  # inline HTML/JS template
"cloud/**" = ["B008"]  # FastAPI Depends() in defaults is the framework idiom
"cloud/tests/*" = ["E501", "B008"]

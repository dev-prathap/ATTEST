[project]
name = "attest-cloud"
version = "0.1.0"
description = "Attest Cloud v0: hosted ledger, confirm inbox, policies, agents & API keys."
requires-python = ">=3.11"
dependencies = [
    "attest",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["attest_cloud"]
